worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Upstream configuration for Load Balancing across Kong instances
    # In a local scenario, we map it to the Kong service
    upstream kong_api {
        server kong:8000;
        # For multiple instances of kong during tests, we would add them here if scaled
    }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck endpoint for the LB itself
        location /lb-health {
            access_log off;
            return 200 "healthy\n";
        }

        # Proxy all other traffic to Kong API Gateway
        location / {
            proxy_pass http://kong_api;
            
            # Forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Handle WebSockets if needed
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

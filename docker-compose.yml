version: '3.8'

services:
  # ==========================================
  # DATABASES (One MySQL container per Service)
  # ==========================================
  identity_db:
    image: mysql:8.0
    container_name: canbankx_identity_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: identity_db
    ports:
      - "33061:3306"
    volumes:
      - identity_db_data:/var/lib/mysql
    networks:
      - canbankx_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  core_banking_db:
    image: mysql:8.0
    container_name: canbankx_core_banking_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: core_banking_db
    ports:
      - "33062:3306"
    volumes:
      - core_banking_db_data:/var/lib/mysql
    networks:
      - canbankx_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment_db:
    image: mysql:8.0
    container_name: canbankx_payment_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment_db
    ports:
      - "33063:3306"
    volumes:
      - payment_db_data:/var/lib/mysql
    networks:
      - canbankx_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  compliance_db:
    image: mysql:8.0
    container_name: canbankx_compliance_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: compliance_db
    ports:
      - "33064:3306"
    volumes:
      - compliance_db_data:/var/lib/mysql
    networks:
      - canbankx_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # CACHING
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: canbankx_redis
    ports:
      - "6379:6379"
    networks:
      - canbankx_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # API GATEWAY (Kong DB-less)
  # ==========================================
  kong:
    image: kong:3.6.1-ubuntu
    container_name: canbankx_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_PLUGINS: bundled,prometheus
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - canbankx_net

  # ==========================================
  # LOAD BALANCER (NGINX)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: canbankx_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - kong
    networks:
      - canbankx_net

  # ==========================================
  # OBSERVABILITY
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: canbankx_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - canbankx_net

  grafana:
    image: grafana/grafana:latest
    container_name: canbankx_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - canbankx_net

networks:
  canbankx_net:
    driver: bridge

volumes:
  identity_db_data:
  core_banking_db_data:
  payment_db_data:
  compliance_db_data:

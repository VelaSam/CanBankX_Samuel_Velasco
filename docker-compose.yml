services:
  identity-api:
    build: .
    command: ["/identity"]
    expose:
      - "8081"
    environment:
      - DB_HOST=identity-db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-canbankx_user}
      - DB_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - DB_NAME=identity_db
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_for_dev_only}
      - GIN_MODE=${GIN_MODE:-debug}
      - PORT=8081
    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      - canbankx-net

  accounts-api:
    build: .
    command: ["/accounts"]
    expose:
      - "8082"
    environment:
      - DB_HOST=accounts-db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-canbankx_user}
      - DB_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - DB_NAME=accounts_db
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_for_dev_only}
      - REDIS_URL=redis:6379
      - GIN_MODE=${GIN_MODE:-debug}
      - PORT=8082
    depends_on:
      accounts-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - canbankx-net

  transactions-api:
    build: .
    command: ["/transactions"]
    expose:
      - "8083"
    environment:
      - DB_HOST=transactions-db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-canbankx_user}
      - DB_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - DB_NAME=transactions_db
      - ACCOUNTS_SERVICE_URL=http://accounts-api:8082
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_for_dev_only}
      - REDIS_URL=redis:6379
      - GIN_MODE=${GIN_MODE:-debug}
      - PORT=8083
    depends_on:
      transactions-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - canbankx-net

  identity-db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - MYSQL_DATABASE=identity_db
      - MYSQL_USER=${DB_USER:-canbankx_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - canbankx-net

  accounts-db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - MYSQL_DATABASE=accounts_db
      - MYSQL_USER=${DB_USER:-canbankx_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - canbankx-net

  transactions-db:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - MYSQL_DATABASE=transactions_db
      - MYSQL_USER=${DB_USER:-canbankx_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - canbankx-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - canbankx-net

  krakend:
    image: devopsfaith/krakend:latest
    ports:
      - "8080:8080"
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json
    networks:
      - canbankx-net
    depends_on:
      - identity-api
      - accounts-api
      - transactions-api

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - canbankx-net
    depends_on:
      - identity-api
      - accounts-api
      - transactions-api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - canbankx-net
    depends_on:
      - prometheus

  # Event Driven - Messaging Infrastructure
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      CLUSTER_ID: "EGNU9rVcQ8isEpe9c5IE9A"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server kafka:9092 || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - canbankx-net

networks:
  canbankx-net:
    driver: bridge

volumes:

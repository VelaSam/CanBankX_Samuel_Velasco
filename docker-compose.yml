services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-canbankx}
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_for_dev_only}
      - GIN_MODE=${GIN_MODE:-debug}
      - API_URL=${API_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - canbankx-net

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${DB_NAME:-canbankx}
      - MYSQL_USER=${DB_USER:-canbankx_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-rootpassword}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - canbankx-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - canbankx-net
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - canbankx-net
    depends_on:
      - prometheus

networks:
  canbankx-net:
    driver: bridge

services:
  identity-api:
    build: .
    command: ["/identity"]
    expose:
      - "8081"
    environment:
      - DB_HOST=identity-db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-canbankx_user}
      - DB_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - DB_NAME=identity_db
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_for_dev_only}
      - GIN_MODE=${GIN_MODE:-debug}
      - PORT=8081
    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      - canbankx-net

  accounts-api:
    build: .
    command: ["/accounts"]
    expose:
      - "8082"
    environment:
      - DB_HOST=accounts-db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-canbankx_user}
      - DB_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - DB_NAME=accounts_db
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_for_dev_only}
      - REDIS_URL=redis:6379
      - GIN_MODE=${GIN_MODE:-debug}
      - PORT=8082
    depends_on:
      accounts-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - canbankx-net

  transactions-api:
    build: .
    command: ["/transactions"]
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=transactions-db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-canbankx_user}
      - DB_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - DB_NAME=transactions_db
      - ACCOUNTS_SERVICE_URL=http://accounts-api:8082
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_for_dev_only}
      - REDIS_URL=redis:6379
      - GIN_MODE=${GIN_MODE:-debug}
      - PORT=8083
    depends_on:
      transactions-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - canbankx-net
      - bbc-network

  identity-db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - MYSQL_DATABASE=identity_db
      - MYSQL_USER=${DB_USER:-canbankx_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - canbankx-net

  accounts-db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - MYSQL_DATABASE=accounts_db
      - MYSQL_USER=${DB_USER:-canbankx_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - canbankx-net

  transactions-db:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
      - MYSQL_DATABASE=transactions_db
      - MYSQL_USER=${DB_USER:-canbankx_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-SecurePassword123!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - canbankx-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - canbankx-net

  krakend:
    image: devopsfaith/krakend:latest
    ports:
      - "8084:8080"
    volumes:
      - ./krakend/krakend.json:/etc/krakend/krakend.json
    networks:
      - canbankx-net
    depends_on:
      - identity-api
      - accounts-api
      - transactions-api

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - canbankx-net
    depends_on:
      - identity-api
      - accounts-api
      - transactions-api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - canbankx-net
    depends_on:
      - prometheus

networks:
  canbankx-net:
    driver: bridge
  bbc-network:
    external: true

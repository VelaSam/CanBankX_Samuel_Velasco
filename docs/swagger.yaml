swagger: "2.0"

basePath: /

info:
  title: CanBankX API
  version: "1.0"
  description: API de la plateforme bancaire CanBankX
  termsOfService: http://swagger.io/terms/
  contact:
    name: API Support
    email: support@canbankx.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

paths:

  /api/v1/accounts/:
    get:
      summary: Lister les comptes
      description: Retourne tous les comptes appartenant à l'utilisateur authentifié
      tags:
        - Accounts
      produces:
        - application/json
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
            additionalProperties: true
        "500":
          description: Internal Server Error
          schema:
            type: object
            additionalProperties: true

    post:
      summary: Ouvrir un compte bancaire
      description: Crée un nouveau compte (CHECKING ou SAVINGS) pour l'utilisateur authentifié
      tags:
        - Accounts
      consumes:
        - application/json
      produces:
        - application/json
      security:
        - BearerAuth: []
      parameters:
        - name: request
          in: body
          description: Open Account Request
          required: true
          schema:
            $ref: "#/definitions/service.OpenAccountRequest"
      responses:
        "201":
          description: Created
          schema:
            type: object
            additionalProperties: true
        "400":
          description: Bad Request
          schema:
            type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
            additionalProperties: true
        "500":
          description: Internal Server Error
          schema:
            type: object
            additionalProperties: true

  /api/v1/accounts/{id}/history:
    get:
      summary: Consulter le solde et l'historique (UC-04)
      description: Récupère le solde calculé via le Ledger et les transactions récentes
      tags:
        - Accounts
      produces:
        - application/json
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Account ID
          required: true
          type: integer
          example: 1
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties: true
        "400":
          description: Bad Request
          schema:
            type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
            additionalProperties: true
        "403":
          description: Forbidden
          schema:
            type: object
            additionalProperties: true
        "500":
          description: Internal Server Error
          schema:
            type: object
            additionalProperties: true

  /api/v1/identity/register:
    post:
      summary: Enregistrer un nouvel utilisateur
      description: Crée un profil utilisateur (KYC PENDING)
      tags:
        - Identity
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: request
          in: body
          description: Register User Request
          required: true
          schema:
            $ref: "#/definitions/service.RegisterRequest"
      responses:
        "201":
          description: Created
          schema:
            type: object
            additionalProperties: true
        "400":
          description: Bad Request
          schema:
            type: object
            additionalProperties: true
        "500":
          description: Internal Server Error
          schema:
            type: object
            additionalProperties: true

  /api/v1/identity/login:
    post:
      summary: S'authentifier (Étape 1)
      description: Valide le courriel/mot de passe et déclenche le MFA
      tags:
        - Identity
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: request
          in: body
          description: Login Request
          required: true
          schema:
            $ref: "#/definitions/service.LoginRequest"
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties: true
        "400":
          description: Bad Request
          schema:
            type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
            additionalProperties: true

  /api/v1/identity/login/mfa:
    post:
      summary: Vérifier le code MFA (Étape 2)
      description: Valide le code MFA et retourne le JWT d'accès complet
      tags:
        - Identity
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: request
          in: body
          description: MFA Verify Request
          required: true
          schema:
            $ref: "#/definitions/service.VerifyMFARequest"
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties: true
        "400":
          description: Bad Request
          schema:
            type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
            additionalProperties: true

  /api/v1/transfers/:
    post:
      summary: Effectuer un virement (UC-05)
      description: Transfère des fonds d'un compte source à un compte cible avec garantie Exactly-Once
      tags:
        - Transfers
      consumes:
        - application/json
      produces:
        - application/json
      security:
        - BearerAuth: []
      parameters:
        - name: request
          in: body
          description: Process Transfer Request
          required: true
          schema:
            $ref: "#/definitions/service.ProcessTransferRequest"
      responses:
        "201":
          description: Created
          schema:
            type: object
            additionalProperties: true
        "400":
          description: Bad Request
          schema:
            type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
            additionalProperties: true
        "500":
          description: Internal Server Error
          schema:
            type: object
            additionalProperties: true

definitions:

  service.RegisterRequest:
    type: object
    required:
      - email
      - firstName
      - lastName
      - password
      - sin
    properties:
      firstName:
        type: string
        example: Alice
      lastName:
        type: string
        example: Smith
      email:
        type: string
        example: alice@test.com
      password:
        type: string
        minLength: 8
        example: Password123!
      sin:
        type: string
        example: "987654321"

  service.LoginRequest:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        example: alice@test.com
      password:
        type: string
        example: Password123!

  service.VerifyMFARequest:
    type: object
    required:
      - code
      - mfaToken
    properties:
      mfaToken:
        type: string
        example: "{{mfaToken}}"
      code:
        type: string
        example: "123456"

  service.OpenAccountRequest:
    type: object
    required:
      - type
    properties:
      type:
        type: string
        enum:
          - CHECKING
          - SAVINGS
        example: CHECKING

  service.ProcessTransferRequest:
    type: object
    required:
      - amount
      - idempotencyKey
      - sourceAccount
      - targetAccount
    properties:
      idempotencyKey:
        type: string
        example: tx-req-001
      sourceAccount:
        type: integer
        example: 1
      targetAccount:
        type: integer
        example: 2
      amount:
        type: number
        example: 50.0

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header

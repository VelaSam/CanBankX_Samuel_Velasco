_format_version: "3.2"
_info:
  select_tags:
    - canbankx

# Global Plugins
plugins:
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true


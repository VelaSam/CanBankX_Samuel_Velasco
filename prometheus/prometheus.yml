global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kong'
    # The Kong API Gateway exposes metrics natively or via prometheus plugin at port 8001
    static_configs:
      - targets: ['kong:8001']

